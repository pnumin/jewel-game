<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>보석 맞추기</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
  :root { --bg1:#1d1838; --bg2:#06050c; --panel:#15122a; --accent:#ffcf4a; --text:#f1eefc; --muted:#a9a3c9; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 16px;
    background: radial-gradient(circle at 50% 20%, var(--bg1), var(--bg2));
    color: var(--text); font-family: "Malgun Gothic", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  }
  h1 { margin: 0; font-size: 28px; letter-spacing: 2px;
       background: linear-gradient(90deg,#ff6b6b,#ffd93d,#6bff8f,#5ec8ff,#d47bff);
       -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hud { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .box { background: var(--panel); border: 1px solid #2c2650; border-radius: 10px; padding: 8px 16px; text-align: center; min-width: 92px; }
  .box small { display: block; color: var(--muted); font-size: 12px; }
  .box b { font-size: 22px; }
  .wrap { position: relative; width: min(512px, 92vw); aspect-ratio: 1; }
  canvas { width: 100%; height: 100%; display: block; border-radius: 14px; background: #000;
           box-shadow: 0 0 0 2px #2c2650, 0 10px 40px #000a; touch-action: none; cursor: pointer; }
  .btns { display: flex; gap: 10px; }
  button { font: inherit; font-weight: bold; border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer;
           background: #2c2650; color: var(--text); }
  button:hover { background: #3b3470; }
  button.main { background: var(--accent); color: #2a1d00; }
  .overlay { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
             gap: 12px; background: #000c; border-radius: 14px; text-align: center; }
  .overlay.show { display: flex; }
  .overlay h2 { margin: 0; font-size: 32px; color: var(--accent); }
  .userbar { display: none; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }
  .userbar.show { display: flex; }
  .userbar b { color: var(--text); }
  .userbar button { padding: 4px 12px; font-size: 13px; }
  .overlay.login { background: #000000e6; }
  .kakao { background: #fee500; color: #191919; display: flex; align-items: center; gap: 8px; padding: 12px 22px; font-size: 16px; }
  .kakao:hover { background: #f5dc00; }
  .err { color: #ff8a8a; font-size: 13px; max-width: 90%; min-height: 1em; }
  .help { color: var(--muted); font-size: 13px; margin: 0; text-align: center; }
</style>
</head>
<body>
<h1>💎 보석 맞추기</h1>
<div class="hud">
  <div class="box"><small>점수</small><b id="score">0</b></div>
  <div class="box"><small>남은 이동</small><b id="moves">30</b></div>
  <div class="box"><small>최고 점수</small><b id="best">0</b></div>
</div>
<div class="userbar" id="userbar"><span><b id="nick"></b> 님 환영합니다</span><button id="logout">로그아웃</button></div>
<div class="wrap">
  <canvas id="board"></canvas>
  <div class="overlay login show" id="login">
    <h2>💎 보석 맞추기</h2>
    <div>카카오 계정으로 로그인하면 게임을 시작할 수 있어요.</div>
    <button class="kakao" id="kakaoLogin">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#191919" d="M12 3C6.48 3 2 6.58 2 11c0 2.85 1.86 5.35 4.66 6.77l-.95 3.5c-.08.3.26.54.52.37l4.17-2.77c.53.07 1.06.11 1.6.11 5.52 0 10-3.58 10-8S17.52 3 12 3z"/></svg>
      카카오 로그인
    </button>
    <div class="err" id="loginErr"></div>
  </div>
  <div class="overlay" id="over">
    <h2>게임 종료!</h2>
    <div id="final"></div>
    <button class="main" id="again">다시 하기</button>
  </div>
</div>
<div class="btns">
  <button id="hint">💡 힌트</button>
  <button class="main" id="newgame">새 게임</button>
</div>
<p class="help">이웃한 보석을 클릭하거나 드래그해서 바꾸세요. 같은 보석 3개 이상을 한 줄로 맞추거나 2×2 사각형으로 모으면 사라집니다.<br>연쇄(콤보)가 일어나면 점수가 배로 올라갑니다!</p>

<script>
const N = 8, S = 64, TYPES = 6, MAX_MOVES = 30;
const cv = document.getElementById('board'), ctx = cv.getContext('2d');
const dpr = window.devicePixelRatio || 1;
cv.width = N * S * dpr; cv.height = N * S * dpr; ctx.scale(dpr, dpr);

// ---------- 보석 모양 ----------
function poly(n, rot) {
  const p = [];
  for (let i = 0; i < n; i++) { const a = rot + i * 2 * Math.PI / n; p.push([Math.cos(a), Math.sin(a)]); }
  return p;
}
const SHAPES = [
  poly(4, -Math.PI / 2),                                              // 빨강 마름모
  [[0, -1], [0.95, 0.62], [-0.95, 0.62]],                             // 초록 삼각형
  [[-0.5, -0.65], [0.5, -0.65], [0.95, -0.15], [0, 0.95], [-0.95, -0.15]], // 파랑 다이아몬드
  poly(8, Math.PI / 8),                                               // 분홍 팔각형
  poly(6, 0),                                                         // 노랑 육각형
  poly(10, 0),                                                        // 보라 원형
];
const HUES = [355, 120, 218, 318, 44, 280];
const LIGHT = [-0.55, -0.83];

function path(pts, r) {
  ctx.beginPath();
  pts.forEach(([x, y], i) => i ? ctx.lineTo(x * r, y * r) : ctx.moveTo(x * r, y * r));
  ctx.closePath();
}
function drawGem(t, cx, cy, r, alpha = 1) {
  const pts = SHAPES[t], h = HUES[t], k = 0.55;
  ctx.save(); ctx.translate(cx, cy); ctx.globalAlpha = alpha;
  path(pts, r); ctx.fillStyle = `hsl(${h},70%,22%)`; ctx.fill();
  // 경사면(facet)
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    let nx = b[1] - a[1], ny = -(b[0] - a[0]); const len = Math.hypot(nx, ny); nx /= len; ny /= len;
    const lit = nx * LIGHT[0] + ny * LIGHT[1];
    ctx.beginPath();
    ctx.moveTo(a[0] * r, a[1] * r); ctx.lineTo(b[0] * r, b[1] * r);
    ctx.lineTo(b[0] * r * k, b[1] * r * k); ctx.lineTo(a[0] * r * k, a[1] * r * k); ctx.closePath();
    ctx.fillStyle = `hsl(${h},78%,${46 + lit * 22}%)`; ctx.fill();
  }
  // 윗면
  path(pts, r * k);
  const g = ctx.createLinearGradient(-r * k, -r * k, r * k, r * k);
  g.addColorStop(0, `hsl(${h},85%,74%)`); g.addColorStop(1, `hsl(${h},78%,50%)`);
  ctx.fillStyle = g; ctx.fill();
  // 테두리 + 하이라이트
  path(pts, r); ctx.lineWidth = 2; ctx.strokeStyle = `hsl(${h},60%,18%)`; ctx.stroke();
  ctx.globalAlpha = alpha * 0.55; ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(-r * 0.22, -r * 0.28, r * 0.16, r * 0.08, -0.6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ---------- 게임 상태 ----------
let grid, sel = null, busy = false, score = 0, moves = MAX_MOVES, combo = 0, hint = null, hintTime = 0;
let particles = [], popups = [], settleQ = [];
let best = 0;
try { best = +localStorage.getItem('jewel-best') || 0; } catch (e) {}

const rnd = n => Math.floor(Math.random() * n);
const gem = (t, x, y) => ({ t, x, y, v: 0, s: 1, dying: false });

function newBoard() {
  do {
    grid = [];
    for (let r = 0; r < N; r++) {
      grid.push([]);
      for (let c = 0; c < N; c++) {
        let t;
        do { t = rnd(TYPES); } while (
          (c >= 2 && grid[r][c - 1].t === t && grid[r][c - 2].t === t) ||
          (r >= 2 && grid[r - 1][c].t === t && grid[r - 2][c].t === t) ||
          (r >= 1 && c >= 1 && grid[r - 1][c].t === t && grid[r][c - 1].t === t && grid[r - 1][c - 1].t === t));
        grid[r].push(gem(t, c, r - N - 1)); // 위에서 떨어지며 등장
      }
    }
  } while (!findMove());
}

function findMatches() {
  const set = new Set();
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const t = grid[r][c]?.t;
    if (t === undefined) continue;
    if (c <= N - 3 && grid[r][c + 1]?.t === t && grid[r][c + 2]?.t === t) {
      let e = c; while (e < N && grid[r][e]?.t === t) set.add(r + ',' + e++);
    }
    if (r <= N - 3 && grid[r + 1][c]?.t === t && grid[r + 2][c]?.t === t) {
      let e = r; while (e < N && grid[e][c]?.t === t) set.add(e++ + ',' + c);
    }
    // 2x2 사각형
    if (r <= N - 2 && c <= N - 2 && grid[r][c + 1]?.t === t && grid[r + 1][c]?.t === t && grid[r + 1][c + 1]?.t === t) {
      set.squares = (set.squares || 0) + 1;
      set.add(r + ',' + c); set.add(r + ',' + (c + 1)); set.add((r + 1) + ',' + c); set.add((r + 1) + ',' + (c + 1));
    }
  }
  return set;
}

function swapCells(a, b) {
  const tmp = grid[a.r][a.c]; grid[a.r][a.c] = grid[b.r][b.c]; grid[b.r][b.c] = tmp;
}

function findMove() {
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    for (const [dr, dc] of [[0, 1], [1, 0]]) {
      const a = { r, c }, b = { r: r + dr, c: c + dc };
      if (b.r >= N || b.c >= N) continue;
      swapCells(a, b); const ok = findMatches().size > 0; swapCells(a, b);
      if (ok) return [a, b];
    }
  }
  return null;
}

const settle = () => new Promise(res => settleQ.push(res));
const wait = ms => new Promise(res => setTimeout(res, ms));

async function trySwap(a, b) {
  busy = true; sel = null; hint = null;
  swapCells(a, b); await settle();
  if (findMatches().size === 0) {          // 맞는 줄이 없으면 되돌리기
    swapCells(a, b); await settle(); busy = false; return;
  }
  moves--; combo = 0; updateHud();
  await resolveBoard();
  busy = false;
  if (moves <= 0) endGame();
}

async function resolveBoard() {
  while (true) {
    const m = findMatches();
    if (!m.size) break;
    combo++;
    const sq = m.squares || 0;
    const pts = m.size * 10 * combo + (m.size >= 4 ? (m.size - 3) * 30 : 0) + sq * 50;
    score += pts; updateHud();
    let sx = 0, sy = 0;
    for (const k of m) {
      const [r, c] = k.split(',').map(Number);
      const g = grid[r][c]; g.dying = true; sx += c; sy += r;
      for (let i = 0; i < 8; i++) {
        const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 160;
        particles.push({ x: c * S + S / 2, y: r * S + S / 2, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.6, h: HUES[g.t] });
      }
    }
    popups.push({ x: (sx / m.size) * S + S / 2, y: (sy / m.size) * S + S / 2, text: (sq ? '사각형! ' : '') + '+' + pts + (combo > 1 ? `  x${combo} 콤보!` : ''), life: 1 });
    await wait(230);
    for (const k of m) { const [r, c] = k.split(',').map(Number); grid[r][c] = null; }
    // 중력 + 새 보석 채우기
    for (let c = 0; c < N; c++) {
      let w = N - 1;
      for (let r = N - 1; r >= 0; r--) {
        if (grid[r][c]) { if (r !== w) { grid[w][c] = grid[r][c]; grid[r][c] = null; } w--; }
      }
      const cnt = w + 1;
      for (let r = w; r >= 0; r--) grid[r][c] = gem(rnd(TYPES), c, r - cnt - 0.3);
    }
    await settle();
  }
  if (!findMove()) await shuffle();
}

async function shuffle() {
  popups.push({ x: N * S / 2, y: N * S / 2, text: '움직일 곳이 없어요! 섞는 중...', life: 1.5 });
  const all = grid.flat();
  do {
    for (let i = all.length - 1; i > 0; i--) { const j = rnd(i + 1); [all[i], all[j]] = [all[j], all[i]]; }
    for (let i = 0; i < all.length; i++) grid[Math.floor(i / N)][i % N] = all[i];
  } while (findMatches().size || !findMove());
  await settle();
}

function updateHud() {
  document.getElementById('score').textContent = score;
  document.getElementById('moves').textContent = moves;
  if (score > best) { best = score; try { localStorage.setItem('jewel-best', best); } catch (e) {} }
  document.getElementById('best').textContent = best;
}

function endGame() {
  document.getElementById('final').innerHTML = `최종 점수 <b style="font-size:28px">${score}</b><br>최고 점수 ${best}`;
  document.getElementById('over').classList.add('show');
}

async function startGame() {
  document.getElementById('over').classList.remove('show');
  score = 0; moves = MAX_MOVES; sel = null; hint = null; busy = true;
  newBoard(); updateHud();
  await settle(); busy = false;
}

// ---------- 입력 ----------
let down = null;
function cellAt(e) {
  const rc = cv.getBoundingClientRect();
  const x = (e.clientX - rc.left) / rc.width * N, y = (e.clientY - rc.top) / rc.height * N;
  return { r: Math.floor(y), c: Math.floor(x), fx: x, fy: y };
}
const adjacent = (a, b) => Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1;

cv.addEventListener('pointerdown', e => {
  if (!user || busy || moves <= 0) return;
  const p = cellAt(e);
  if (p.r < 0 || p.r >= N || p.c < 0 || p.c >= N) return;
  down = p; cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!down || busy) return;
  const p = cellAt(e), dx = p.fx - down.fx, dy = p.fy - down.fy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 0.45) return;
  const b = Math.abs(dx) > Math.abs(dy) ? { r: down.r, c: down.c + Math.sign(dx) } : { r: down.r + Math.sign(dy), c: down.c };
  const a = { r: down.r, c: down.c }; down = null;
  if (b.r >= 0 && b.r < N && b.c >= 0 && b.c < N) trySwap(a, b);
});
cv.addEventListener('pointerup', () => {
  if (!down || busy) { down = null; return; }
  const p = { r: down.r, c: down.c }; down = null;
  if (sel && adjacent(sel, p)) trySwap(sel, p);
  else sel = (sel && sel.r === p.r && sel.c === p.c) ? null : p;
});

document.getElementById('hint').onclick = () => {
  if (!user || busy) return;
  hint = findMove(); hintTime = 0;
};
document.getElementById('newgame').onclick = () => { if (user && !busy) startGame(); };
document.getElementById('again').onclick = startGame;

// ---------- 그리기 루프 ----------
let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
  let moving = false;

  ctx.clearRect(0, 0, N * S, N * S);
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    ctx.fillStyle = (r + c) % 2 ? '#0d0b18' : '#14112400';
    ctx.fillRect(c * S, r * S, S, S);
  }
  if (sel) {
    ctx.fillStyle = '#ffffff22'; ctx.fillRect(sel.c * S, sel.r * S, S, S);
    ctx.strokeStyle = '#ffcf4a'; ctx.lineWidth = 3; ctx.strokeRect(sel.c * S + 2, sel.r * S + 2, S - 4, S - 4);
  }
  if (hint) {
    hintTime += dt;
    if (hintTime > 2.5) hint = null;
    else {
      ctx.strokeStyle = `rgba(255,255,255,${0.5 + 0.5 * Math.sin(hintTime * 10)})`; ctx.lineWidth = 3;
      for (const h of hint) ctx.strokeRect(h.c * S + 4, h.r * S + 4, S - 8, S - 8);
    }
  }

  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const g = grid[r][c]; if (!g) continue;
    const dx = c - g.x, dy = r - g.y;
    if (dx || dy) {
      moving = true;
      g.v = Math.min(g.v + 40 * dt, 18);
      const d = Math.hypot(dx, dy), step = (7 + g.v) * dt;
      if (d <= step) { g.x = c; g.y = r; g.v = 0; } else { g.x += dx / d * step; g.y += dy / d * step; }
    }
    if (g.dying) g.s = Math.max(0, g.s - dt * 4.5);
    const pulse = sel && sel.r === r && sel.c === c ? 1 + Math.sin(ts / 120) * 0.06 : 1;
    drawGem(g.t, g.x * S + S / 2, g.y * S + S / 2, S * 0.4 * g.s * pulse, g.dying ? g.s : 1);
  }

  particles = particles.filter(p => (p.life -= dt) > 0);
  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt;
    ctx.globalAlpha = p.life / 0.6; ctx.fillStyle = `hsl(${p.h},90%,70%)`;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
  popups = popups.filter(p => (p.life -= dt * 0.9) > 0);
  ctx.textAlign = 'center'; ctx.font = 'bold 22px "Malgun Gothic", sans-serif';
  for (const p of popups) {
    ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = '#ffe680'; ctx.fillText(p.text, p.x, p.y);
    p.y -= 30 * dt;
  }
  ctx.globalAlpha = 1;

  if (!moving && settleQ.length) { const q = settleQ; settleQ = []; q.forEach(f => f()); }
  requestAnimationFrame(frame);
}

// ---------- Supabase 카카오 로그인 ----------
const SUPABASE_URL = 'https://qmbmkcjwtbfzuypjzqqk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_fiHMf2mtKzwehtIExN_zOg_hCY-AR8c'; // 공개용(publishable) 키
let user = null, sb = null;
const loginErr = document.getElementById('loginErr');

function setUser(u) {
  const was = user;
  user = u;
  document.getElementById('login').classList.toggle('show', !u);
  document.getElementById('userbar').classList.toggle('show', !!u);
  if (u) {
    const m = u.user_metadata || {};
    document.getElementById('nick').textContent = m.name || m.full_name || m.preferred_username || m.user_name || u.email || '플레이어';
    if (!was) startGame();
  }
}

if (window.supabase) {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  sb.auth.onAuthStateChange((_event, session) => setUser(session?.user ?? null));
  sb.auth.getSession().then(({ data }) => {
    setUser(data.session?.user ?? null);
    // 로그인 후 주소창의 ?code= 등을 정리
    if (location.search || location.hash) history.replaceState(null, '', location.pathname);
  });
  const params = new URLSearchParams(location.search + '&' + location.hash.slice(1));
  if (params.get('error_description')) loginErr.textContent = '로그인 실패: ' + params.get('error_description');
} else {
  loginErr.textContent = 'Supabase 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.';
}

document.getElementById('kakaoLogin').onclick = async () => {
  if (!sb) return;
  if (location.protocol === 'file:') {
    loginErr.textContent = '파일을 직접 열면 로그인할 수 없어요. 배포된 주소(https://...)에서 실행하세요.';
    return;
  }
  loginErr.textContent = '';
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'kakao',
    options: { redirectTo: location.origin + location.pathname },
  });
  if (error) loginErr.textContent = '로그인 실패: ' + error.message;
};
document.getElementById('logout').onclick = async () => {
  await sb.auth.signOut();
  setUser(null);
};

newBoard();  // 로그인 화면 뒤에 보일 보드
requestAnimationFrame(frame);
</script>
</body>
</html>
